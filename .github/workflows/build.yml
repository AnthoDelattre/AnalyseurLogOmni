name: Build multi-OS

# Genere les executables Windows, macOS et Linux automatiquement.
# Se declenche a chaque tag "v*" (ex: v1.0) ou manuellement (onglet Actions).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests unitaires
        run: python -m unittest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: windows
            artefact: dist/AnalyseurLog.exe
          - os: macos-latest
            nom: macos
            artefact: dist/AnalyseurLog.app
          - os: ubuntu-latest
            nom: linux
            artefact: dist/AnalyseurLog

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances Tk (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Installer PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Recuperer plink/pscp (PuTTY) pour le SSH bastion
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/windows | Out-Null
          $base = 'https://the.earth.li/~sgtatham/putty/latest/w64'
          Invoke-WebRequest "$base/plink.exe" -OutFile vendor/windows/plink.exe
          Invoke-WebRequest "$base/pscp.exe"  -OutFile vendor/windows/pscp.exe

      - name: Compiler
        run: pyinstaller --noconfirm --clean AnalyseurLog.spec

      - name: Zipper le .app macOS avec script installation
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          # Copier le script d'installation dans dist/
          cp ../install-macos.sh .
          # Créer le ZIP avec le script et le .app
          ditto -c -k --keepParent AnalyseurLog.app AnalyseurLog.app.zip
          # Ajouter le script au ZIP (en dehors du .app)
          zip -j AnalyseurLog.app.zip install-macos.sh
          ls -lh AnalyseurLog.app.zip
          unzip -l AnalyseurLog.app.zip | head -10

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: AnalyseurLog-${{ matrix.nom }}
          path: ${{ matrix.os == 'macos-latest' && 'dist/AnalyseurLog.app.zip' || matrix.artefact }}
